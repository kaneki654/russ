[package]
name = "russ"
version = "0.2.2"
edition = "2021"
description = "RUSS — Rapid Universal Secure Sender"
license = "MIT"
publish = false
default-run = "russ"
build = "build.rs"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
eframe = "0.29"
egui = "0.29"
if-addrs = "0.13"
notify = "7.0"
rcgen = "0.14"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
ring = "0.17"
rfd = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
socket2 = "0.5"
sysinfo = "0.33"
tokio = { version = "1.41", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.14"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[[bench]]
name = "streaming"
harness = false
